<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Global Presence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/global-presence.css" />
  </head>
  <body>
    <section class="global-presence">
      <div class="global-presence_layout">
        <div class="global-presence_stat">
          <div class="global-presence_number" data-region-count>6</div>
          <div class="global-presence_label">CONTINENTS</div>
        </div>

        <div id="global-globe" class="global-globe">
          <canvas class="global-globe_canvas"></canvas>
          <svg class="global-globe_ring" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <div class="global-globe_status" hidden></div>
        </div>

        <div class="global-presence_stat">
          <div class="global-presence_number" data-country-count>45+</div>
          <div class="global-presence_label">COUNTRIES</div>
        </div>
      </div>

      <!-- Local stand-in for hidden Webflow Collection Lists. Do not hard-code this in JS. -->
      <div class="globe-cms-data">
        <div
          class="globe-region-data"
          data-globe-region="asia"
          data-region-name="Asia"
          data-center-lat="21"
          data-center-lon="79"
          data-sort="1"
          data-start-region="true"
          data-highlight-color="#A000A0"
        ></div>
        <div
          class="globe-region-data"
          data-globe-region="europe"
          data-region-name="Europe"
          data-center-lat="48"
          data-center-lon="8"
          data-sort="2"
          data-start-region="false"
        ></div>
        <div
          class="globe-region-data"
          data-globe-region="africa"
          data-region-name="Africa"
          data-center-lat="1"
          data-center-lon="24"
          data-sort="3"
          data-start-region="false"
        ></div>
        <div
          class="globe-region-data"
          data-globe-region="north-america"
          data-region-name="North America"
          data-center-lat="39"
          data-center-lon="-96"
          data-sort="4"
          data-start-region="false"
        ></div>
        <div
          class="globe-region-data"
          data-globe-region="south-america"
          data-region-name="South America"
          data-center-lat="-18"
          data-center-lon="-60"
          data-sort="5"
          data-start-region="false"
        ></div>
        <div
          class="globe-region-data"
          data-globe-region="oceania"
          data-region-name="Oceania"
          data-center-lat="-24"
          data-center-lon="138"
          data-sort="6"
          data-start-region="false"
        ></div>

        <div class="globe-country-data" data-globe-country="KAZ" data-country-name="Kazakhstan" data-region="asia" data-sort="1"></div>
        <div class="globe-country-data" data-globe-country="MNG" data-country-name="Mongolia" data-region="asia" data-sort="2"></div>
        <div class="globe-country-data" data-globe-country="CHN" data-country-name="China" data-region="asia" data-sort="3"></div>
        <div class="globe-country-data" data-globe-country="JPN" data-country-name="Japan" data-region="asia" data-sort="4"></div>
        <div class="globe-country-data" data-globe-country="IND" data-country-name="India" data-region="asia" data-sort="5"></div>
        <div class="globe-country-data" data-globe-country="THA" data-country-name="Thailand" data-region="asia" data-sort="6"></div>
        <div class="globe-country-data" data-globe-country="MYS" data-country-name="Malaysia" data-region="asia" data-sort="7"></div>
        <div class="globe-country-data" data-globe-country="SGP" data-country-name="Singapore" data-region="asia" data-sort="8"></div>
        <div class="globe-country-data" data-globe-country="IDN" data-country-name="Indonesia" data-region="asia" data-sort="9"></div>
        <div class="globe-country-data" data-globe-country="SAU" data-country-name="Saudi Arabia" data-region="asia" data-sort="10"></div>
        <div class="globe-country-data" data-globe-country="ARE" data-country-name="United Arab Emirates" data-region="asia" data-sort="11"></div>
        <div class="globe-country-data" data-globe-country="QAT" data-country-name="Qatar" data-region="asia" data-sort="12"></div>
        <div class="globe-country-data" data-globe-country="KWT" data-country-name="Kuwait" data-region="asia" data-sort="13"></div>
        <div class="globe-country-data" data-globe-country="BHR" data-country-name="Bahrain" data-region="asia" data-sort="14"></div>
        <div class="globe-country-data" data-globe-country="OMN" data-country-name="Oman" data-region="asia" data-sort="15"></div>

        <div class="globe-country-data" data-globe-country="NOR" data-country-name="Norway" data-region="europe" data-sort="1"></div>
        <div class="globe-country-data" data-globe-country="SWE" data-country-name="Sweden" data-region="europe" data-sort="2"></div>
        <div class="globe-country-data" data-globe-country="DNK" data-country-name="Denmark" data-region="europe" data-sort="3"></div>
        <div class="globe-country-data" data-globe-country="NLD" data-country-name="Netherlands" data-region="europe" data-sort="4"></div>
        <div class="globe-country-data" data-globe-country="BEL" data-country-name="Belgium" data-region="europe" data-sort="5"></div>
        <div class="globe-country-data" data-globe-country="IRL" data-country-name="Ireland" data-region="europe" data-sort="6"></div>
        <div class="globe-country-data" data-globe-country="GBR" data-country-name="United Kingdom" data-region="europe" data-sort="7"></div>
        <div class="globe-country-data" data-globe-country="FRA" data-country-name="France" data-region="europe" data-sort="8"></div>
        <div class="globe-country-data" data-globe-country="ESP" data-country-name="Spain" data-region="europe" data-sort="9"></div>
        <div class="globe-country-data" data-globe-country="ITA" data-country-name="Italy" data-region="europe" data-sort="10"></div>

        <div class="globe-country-data" data-globe-country="COD" data-country-name="Democratic Republic of the Congo" data-region="africa" data-sort="1"></div>
        <div class="globe-country-data" data-globe-country="UGA" data-country-name="Uganda" data-region="africa" data-sort="2"></div>
        <div class="globe-country-data" data-globe-country="TZA" data-country-name="Tanzania" data-region="africa" data-sort="3"></div>
        <div class="globe-country-data" data-globe-country="ZMB" data-country-name="Zambia" data-region="africa" data-sort="4"></div>
        <div class="globe-country-data" data-globe-country="MDG" data-country-name="Madagascar" data-region="africa" data-sort="5"></div>
        <div class="globe-country-data" data-globe-country="ZWE" data-country-name="Zimbabwe" data-region="africa" data-sort="6"></div>
        <div class="globe-country-data" data-globe-country="BWA" data-country-name="Botswana" data-region="africa" data-sort="7"></div>
        <div class="globe-country-data" data-globe-country="NAM" data-country-name="Namibia" data-region="africa" data-sort="8"></div>

        <div class="globe-country-data" data-globe-country="USA" data-country-name="United States" data-region="north-america" data-sort="2"></div>
        <div class="globe-country-data" data-globe-country="MEX" data-country-name="Mexico" data-region="north-america" data-sort="3"></div>
        <div class="globe-country-data" data-globe-country="PAN" data-country-name="Panama" data-region="north-america" data-sort="4"></div>
        <div class="globe-country-data" data-globe-country="PRI" data-country-name="Puerto Rico" data-region="north-america" data-sort="5"></div>
        <div class="globe-country-data" data-globe-country="TTO" data-country-name="Trinidad and Tobago" data-region="north-america" data-sort="6"></div>

        <div class="globe-country-data" data-globe-country="COL" data-country-name="Colombia" data-region="south-america" data-sort="1"></div>
        <div class="globe-country-data" data-globe-country="ECU" data-country-name="Ecuador" data-region="south-america" data-sort="2"></div>
        <div class="globe-country-data" data-globe-country="PER" data-country-name="Peru" data-region="south-america" data-sort="3"></div>
        <div class="globe-country-data" data-globe-country="BRA" data-country-name="Brazil" data-region="south-america" data-sort="4"></div>
        <div class="globe-country-data" data-globe-country="CHL" data-country-name="Chile" data-region="south-america" data-sort="5"></div>
        <div class="globe-country-data" data-globe-country="ARG" data-country-name="Argentina" data-region="south-america" data-sort="6"></div>

        <div class="globe-country-data" data-globe-country="PNG" data-country-name="Papua New Guinea" data-region="oceania" data-sort="1"></div>
        <div class="globe-country-data" data-globe-country="AUS" data-country-name="Australia" data-region="oceania" data-sort="2"></div>
        <div class="globe-country-data" data-globe-country="NZL" data-country-name="New Zealand" data-region="oceania" data-sort="3"></div>
      </div>
    </section>

    <script src="./vendor/three.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./data/land-pixels.js"></script>
    <script src="./js/global-presence.js"></script>
    <script>
      window.GlobalPresence.init().catch(function (error) {
        window.__gpError = String(error && error.stack ? error.stack : error);
        console.error(error);
        var status = document.querySelector(".global-globe_status");
        if (status) {
          status.hidden = false;
          status.textContent = "The globe could not start. Serve this folder over http and confirm Three.js loaded.";
        }
      });
    </script>
  </body>
</html>
